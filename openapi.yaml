openapi: 3.0.3
info:
  title: Smart Parking System API
  version: "1.0.0"
  description: |
    Smart Parking System backend API.

    Features:
    - Parking lot management (lots, levels, slots)
    - Vehicle check-in / check-out
    - Parking session tracking
    - Fee calculation based on duration and vehicle type

servers:
  - url: https://localhost:8080
    description: dev

tags:
  - name: lots
  - name: levels
  - name: slots
  - name: sessions

paths:

  # -------------------- LOTS --------------------

  /api/v1/parking/lots:
    post:
      tags: [lots]
      operationId: CreateLot
      summary: Create parking lot
      description: Create a new parking lot with a unique name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotCreate'
      responses:
        '201':
          description: Parking lot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Domain exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/parking/lots/{lotId}:
    delete:
      tags: [lots]
      operationId: DeleteLot
      summary: Delete parking lot
      parameters:
        - $ref: '#/components/parameters/lotId'
      responses:
        '204':
          description: Deleted
        '404':
          description: Lot with such ID not found
          $ref: '#/components/responses/NotFound'

  # -------------------- LEVELS --------------------

  /api/v1/parking/lots/{lotId}/levels:
    post:
      tags: [levels]
      operationId: CreateLevel
      summary: Add level to parking lot
      parameters:
        - $ref: '#/components/parameters/lotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelCreate'
      responses:
        '201':
          description: Level created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Domain exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/parking/lots/{lotId}/levels/{levelNumber}:
    delete:
      tags: [levels]
      operationId: DeleteLevel
      summary: Remove level
      parameters:
        - $ref: '#/components/parameters/levelNumber'
      responses:
        '204':
          description: Deleted
        '404':
          description: Level with such number not found
          $ref: '#/components/responses/NotFound'

  # -------------------- SLOTS --------------------

  /api/v1/parking/lots/{lotId}/levels/{levelNumber}/slots:
    post:
      tags: [slots]
      operationId: CreateSlot
      summary: Add parking slot
      parameters:
        - $ref: '#/components/parameters/lotId'
        - $ref: '#/components/parameters/levelNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreate'
      responses:
        '201':
          description: Slot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Domain exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/parking/lots/{lotId}/levels/{levelNumber}/slots/{slotId}:
    patch:
      tags: [slots]
      operationId: UpdateSlot
      summary: Update slot status (available/unavailable)
      parameters:
        - $ref: '#/components/parameters/lotId'
        - $ref: '#/components/parameters/levelNumber'
        - $ref: '#/components/parameters/slotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotUpdate'
      responses:
        '200':
          description: Slot updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [slots]
      operationId: DeleteSlot
      summary: Remove slot
      parameters:
        - $ref: '#/components/parameters/lotId'
        - $ref: '#/components/parameters/levelNumber'
        - $ref: '#/components/parameters/slotId'
      responses:
        '204':
          description: Deleted
        '404':
          description: Slot with such number not found
          $ref: '#/components/responses/NotFound'

  # -------------------- VEHICLE CHECK-IN / CHECK-OUT --------------------

  /api/v1/sessions/lots/{lotId}:
    post:
      tags: [sessions]
      operationId: CheckInVehicle
      summary: Check-in vehicle
      description: |
        Assigns an available compatible slot and creates a parking session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Vehicle checked-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewParkingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Domain exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [sessions]
      operationId: GetActiveSessions
      summary: Get active parking sessions
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParkingSession'

  /api/v1/sessions/{sessionId}/check-out:
    post:
      tags: [sessions]
      operationId: CheckOutVehicle
      summary: Check-out vehicle
      description: Completes session, frees slot and calculates fee.
      responses:
        '200':
          description: Checkout summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  parameters:
    lotId:
      name: lotId
      in: path
      required: true
      schema:
        type: string

    levelNumber:
      name: levelNumber
      in: path
      required: true
      schema:
        type: string

    slotId:
      name: slotId
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Bad request - inproper field types, missing required fields, etc.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Lot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          #ASSUMPTION: Lot names should be unique and not too long, let's say max 256 characters.
          maxLength: 256
        levels:
          type: array
          items:
            $ref: '#/components/schemas/Level'

    Level:
      type: object
      properties:
        #ASSUMPTION: level ID may be represented by a string combining lot ID and level number (so we can easily identify which lot it belongs to without extra queries)(?).
        number:
          type: integer
        lotId:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'

    Slot:
      type: object
      properties:
        #ASSUMPTION: slot ID may be represented by a string combining level ID and slot number (so we can easily identify which level it belongs to without extra queries)(?).
        id:
          type: string
        levelNumber:
          type: string
        type:
          $ref: '#/components/schemas/SlotType'
        status:
          $ref: '#/components/schemas/SlotStatus'

    LotCreate:
      type: object
      properties:
        name:
          type: string
        #TODO: It's naturally to create a lot with some levels already, so we can (but not obliged to) include them in the request.
        # They will be created together with the lot.
      required: [name]

    LevelCreate:
      type: object
      properties:
        number:
          description: Number of parking lot level to be added. Must be unique within a parking lot.
          type: integer
        #TODO: Similar to levels, it's convenient to create a level with some slots already, so we can (but not obliged to) include them in the request.
      required: [number]

    SlotCreate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SlotType'
      required: [type]

    SlotUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SlotStatusUpdate'
      required: [status]

    Vehicle:
      type: object
      description: Vehicle entity representation.
      properties:
        licensePlate:
          description: Vehicle license plate number. Must be unique among ACTIVE parking sessions.
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
      required: [licensePlate, type]

    ParkingSession:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        licensePlate:
          type: string
        lotId:
          type: string
        levelNumber:
          type: integer
        slotId:
          type: integer
        entryTime:
          type: string
          format: date-time
        exitTime:
          type: string
          format: date-time

    CheckInRequest:
      type: object
      properties:
        vehicle:
          $ref: '#/components/schemas/Vehicle'
      required: [vehicle]

    NewParkingSession:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        licensePlate:
          type: string
        lotId:
          type: string
        levelNumber:
          type: integer
        slotId:
          type: integer
        entryTime:
          type: string
          format: date-time

    CompletedSession:
      type: object
      properties:
        licensePlate:
          type: string
        entryTime:
          type: string
        exitTime:
          type: string
        durationMinutes:
          type: integer
        fee:
          type: number

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "SESSION_NOT_FOUND"
        message:
          type: string
          example: "Session not found"

# --- ENUMS ---

    SlotType:
      type: string
      enum: [COMPACT, LARGE, MOTORCYCLE, HANDICAPPED]

    SlotStatus:
      type: string
      enum: [AVAILABLE, OCCUPIED, UNAVAILABLE]

    SlotStatusUpdate:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]

    VehicleType:
      type: string
      enum: [CAR, MOTORCYCLE, TRUCK]

    SessionStatus:
      type: string
      enum: [ACTIVE, COMPLETED]